# =============================================================================
# config/countries.yaml · los países que sigue MeloMap
# -----------------------------------------------------------------------------
# YAML en 30 segundos:
#   clave: valor          → un dato
#   - elemento            → un elemento de una lista
#   la sangría (espacios, NUNCA tabuladores) indica qué está dentro de qué
#   [a, b]                → lista en una sola línea
#   # texto               → comentario
#
# Campos de cada país:
#   code     código ISO 3166-1 de dos letras
#   name_es  nombre en español latino
#   name_en  nombre en inglés
#   region   na · la · eu · me · af · as · kp · oc
#   sources  fuentes de datos que se consultan: apple, lastfm
#
# Para agregar un país basta con añadir un bloque aquí; el código no cambia.
# El test test_real_config_file_is_valid comprueba que este archivo sea válido.
# =============================================================================

countries:
  # --- Norteamérica ---------------------------------------------------------
  - code: US
    name_es: Estados Unidos
    name_en: United States
    region: na
    sources: [apple, lastfm]
